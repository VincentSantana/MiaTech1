<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @layer components {
            .btn {
                background-color: #696969;
                color: white;
                padding: 5px 20px;
                border-radius: 5px;
                cursor: pointer;
                margin: 10px;
                width: 100px;
                height: 80px;
            }
        }
    </style>
</head>

<body>
    <p class="flex flex-wrap font-bold underline">
        Implementa una griglia responsive che cambia il numero di colonne in base alla dimensione dello schermo
        utilizzando classi come grid-cols-1, md:grid-cols-2, lg:grid-cols-3.
    </p>
    <br>
    <br>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 container mx-auto">
        <div class="btn">tab 1</div>
        <div class="btn">tab 2</div>
        <div class="btn">tab 3</div>
        <div class="btn">tab 4</div>
        <div class="btn">tab 5</div>
        <div class="btn">tab 6</div>
        <div class="btn">tab 7</div>
        <div class="btn">tab 8</div>
        <div class="btn">tab 9</div>
    </div>
</body>

</html>
