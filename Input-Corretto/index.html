<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Corretto</title>
</head>

<body>
    <h1>IL Prompt</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ducimus sint neque rem eius totam saepe natus id odit
        repellat cum velit incidunt culpa omnis voluptatibus blanditiis voluptas voluptatem, doloribus vel.</p>

    <script type="text/javascript">

        let word = prompt('Buongiorno');

        do {
            word = prompt("inserisci una parola")

        } while (word.length < 5);

        console.log(word)
    </script>
</body>

</html>
