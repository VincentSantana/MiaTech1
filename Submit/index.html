<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit</title>
</head>

<body>
    <p>
        Crea un form con 2 input di testo: nome e cognome. Crea un bottone di submit del form. Gestisci l'evento submit
        in modo che prima che venga inviato un form mostri un alert se i campi non sono compilati, se sono compilati
        potrà eseguire il submit del form.
    </p>

    <h1>Login:</h1>

    <form id="form">
        <label>Nome:</label>
        <input type="text" id="fname" placeholder="inserire nome"><br><br>
        <label >Cognome:</label>
        <input type="text" id="lname" placeholder="inserire cognome"><br><br>
        <input type="submit" value="invia">
    </form>

    <script src="script.js"></script>
</body>

</html>
