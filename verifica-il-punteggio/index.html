<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifica il Punteggio</title>
</head>
<body>
    <h1>Risultato delle prove</h1>
    <script type="text/javascript">
        
        let stringanumero = prompt('Voto');
        let score = parseInt(stringanumero);

        console.log(score)
    
        switch(score){
            case 100,99,98,97,96,95,94,93,92,91,90: 
            document.write("voto ottimo")
            break
            case 89,88,87,86,85,84,83,82,81,80,79,78,77,76,75,74,73,72,71,70:
            document.write("voto buono")
            break
            case 69,68,67,66,65,64,63,62,61,60:
            document.write("voto sufficiente")
            break
            default:
            document.write("voto insufficiente")  
        }
     
     </script>
</body>
</html>
