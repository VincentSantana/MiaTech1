<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Stili disabled</title>
</head>
<body>
    <p class="font-bold text-xl">
        Crea un form che includa campi di input e pulsanti che cambiano stile quando sono disabilitati (disabled:).
    </p>

    <form class="p-4 border-2 border-black inline-block rounded-md m-2">
        <label for="nome" class="font-bold">Nome:</label>
        <input type="text" id="nome"></input>
        <br>
        <label for="cognome" class="font-bold">Cognome:</label>
        <input type="text" id="cognome"></input>
        <br>
        <button class="bg-orange-500 hover:bg-orange-700 text-white font-bold py-1 px-3 rounded-lg disabled:bg-gray-300 disabled:text-gray-600 disabled:cursor-not-allowed" type="submit">Invia</button>
        <button class="bg-orange-500 hover:bg-orange-700 text-white font-bold py-1 px-3 rounded-lg disabled:bg-gray-300 disabled:text-gray-600 disabled:cursor-not-allowed" type="submit" disabled>Invia</button>
    </form>
     
</body>
</html>
