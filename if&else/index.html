<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If & Else</title>
</head>
<body>
    <h1>Provando if & else in console</h1>
    <script type="text/javascript">
        
       let number = 6;

       if(number > 5){
        console.log("la variabile è maggiore di 5")
       } else { console.log("la variabile è minore di 5")}
 
     </script>
</body>
</html>
