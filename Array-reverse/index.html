<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array reverse</title>
</head>
<body>
    <h1>Ordine giusto del mio array:</h1>
    <script type="text/javascript">

        const listanumeri = [
            "uno",
            "due",
            "tre",
            "quattro",
            "cinque",
            "sei"
        ];

        let inverso = "";

        for (let i = listanumeri.length - 1; i >= 0; i--){
            inverso += listanumeri[i]
        
        }

        console.log(inverso);
        
    </script>
</body>
</html>
