<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stile dark mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                darkMode: 'class',
                extend: {
                    colors: {
                        
                    },
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .dark {
                background-color: #696969;
                color: white;
            }
        }
    </style>
</head>

<body class="">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold ">Modalità scura con Tailwind</h1>
        <p class="text-lg">Questo testo cambierà colore quando la modalità scura è attivata.</p>
        <button
           id="darkModeToggle" class=" font-bold py-2 px-4 rounded dark:bg-gray-500 dark:hover:bg-gray-700">Modalità: <span id="darkModeStatus">OFF</span></button>
    </div>


    <script>
        const toggleDarkMode = () => {
            document.body.classList.toggle('dark');
            document.querySelector("#darkModeStatus").innerHTML = document.body.classList.contains("dark") ? "ON" : "OFF";
        };

        document.querySelector("#darkModeToggle").addEventListener('click', toggleDarkMode);
    </script>
</body>

</html>
