<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>>voti esame</title>
</head>
<body>
    <h1>Risultato delle prove</h1>
    <script type="text/javascript">
        
        let stringanumero = prompt('Voto');
        let score = parseInt(stringanumero);

        console.log(score)

        if (score <= 100, score >= 90){
            document.write("voto ottimo")
        } else if (score <= 89, score >= 70) {document.write("voto buono")}
        else if (score <= 69, score >= 60) {document.write("voto sufficiente")}
        else {document.write("voto insufficiente") }
     
     </script>
</body>
</html>
